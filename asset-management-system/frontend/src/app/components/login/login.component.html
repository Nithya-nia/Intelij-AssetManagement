<div class="login-wrapper d-flex align-items-center justify-content-center">
  <div class="login-card shadow-lg p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-3">
        <i class="bi bi-shield-lock-fill text-white fs-2"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">Asset Management</h3>
      <p class="text-muted small">Administrator Secure Access Portal</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center p-3 mb-3 small" role="alert">
      <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2 fs-5"></i>
      <div>{{ errorMessage }}</div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0">
            <i class="bi bi-person"></i>
          </span>
          <input
            type="text"
            id="username"
            class="form-control border-start-0"
            placeholder="Enter admin username"
            formControlName="username"
            [class.is-invalid]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid"
          />
        </div>
        <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" class="text-danger small mt-1">
          Username is required.
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0">
            <i class="bi bi-lock"></i>
          </span>
          <input
            type="password"
            id="password"
            class="form-control border-start-0"
            placeholder="Enter admin password"
            formControlName="password"
            [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
          />
        </div>
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-danger small mt-1">
          Password is required.
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        <span *ngIf="!loading"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Dashboard</span>
        <span *ngIf="loading">Authenticating...</span>
      </button>

      <div class="text-center mt-4 text-muted small">
        <span class="badge bg-light text-secondary border">Default: admin / admin123</span>
      </div>
    </form>
  </div>
</div>
